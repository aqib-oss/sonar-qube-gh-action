name: main-workflow

on:
  push:
    branches: ["main"]

permissions:
  # Needed for managing releases and pushing code
  contents: write
  # For GitHub Pages
  pages: write
  # For auth to third-party services
  id-token: write

concurrency:
  group: "sonar_qube_gh_action-${{ github.head_ref }}"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  TEST_IMPORT: "${{ vars.TEST_IMPORT_STATEMENT }}"
  LINK_TO_RELEASES: "https://github.com/${{ github.repository }}/releases"

jobs:
  main-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # Install a specific version of uv.
          version: "0.13.6"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Unit tests
        run: uv run pytest

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMVER_GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Action | Semantic Version Release
        id: release
        # Adjust tag with desired version if applicable.
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.SEMVER_GH_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish | Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.SEMVER_GH_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Recover | Create missing GitHub Release
        # If a previous run pushed the version commit and tag but failed to create
        # the GitHub Release (e.g. expired token), a re-run makes no new release.
        # Create the release for that tag, with its notes and assets.
        if: steps.release.outputs.released == 'false' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.SEMVER_GH_TOKEN }}
          SEMVER_GH_TOKEN: ${{ secrets.SEMVER_GH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release for $TAG already exists."
            exit 0
          fi
          echo "GitHub Release for $TAG is missing; creating it."
          # semantic-release needs a branch matching its config, not a detached HEAD.
          git checkout --force -B main "$TAG"
          rm -rf dist
          uv build
          uv run --no-sync semantic-release changelog --post-to-release-tag "$TAG"
          uv run --no-sync semantic-release publish --tag "$TAG"
